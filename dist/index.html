<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1e6">
  <meta name="description" content="A gentle idle life game: live in a Japanese neighborhood, learn the language, share meals and stories, and raise up local leaders in five cities.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Little Light">
  <title>A Little Light · Life in Japan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body data-tab="town">
  <div id="app">
    <header class="hud">
      <button class="hud-xp" id="hud-xp" aria-label="Experience">
        <span class="hud-mark">✦</span>
        <span class="hud-xp-text"><b id="xp">15</b><small id="rate">+0 / sec</small></span>
      </button>
      <div class="hud-stats">
        <button class="chip" id="chip-jp" data-tab="learn" aria-label="Japanese insight"><span class="chip-icon">あ</span><b id="jp">0</b></button>
        <span class="chip" aria-label="Cultural understanding"><span class="chip-icon">❀</span><b id="culture">0</b></span>
        <button class="chip" id="chip-bonds" data-tab="people" aria-label="Connection"><span class="chip-icon">♡</span><b id="bonds">0</b></button>
      </div>
      <button class="icon-btn" id="settings-btn" aria-label="Settings and save">⚙</button>
    </header>

    <main class="stage">
      <section id="world-view" class="world-view" aria-label="Your neighborhood">
        <canvas id="world-canvas"></canvas>
        <div id="world-overlay" class="world-overlay"></div>
        <div id="fallback-town" class="fallback-town" hidden><img src="assets/neighborhood.webp" alt="An illustrated Japanese neighborhood in spring"></div>
        <div class="world-top">
          <div class="where">
            <b id="city-name">Tokyo</b>
            <small id="where-line">Hanamimachi · spring</small>
          </div>
          <button id="view-toggle" class="icon-btn view-toggle" aria-label="See the whole neighborhood" title="See the whole neighborhood">⤢</button>
        </div>
        <button id="goal-chip" class="goal-chip" type="button">
          <span class="goal-kicker" id="goal-kicker">A purpose for today</span>
          <span class="goal-title" id="goal-title"></span>
          <span class="goal-progress"><i id="goal-fill"></i></span>
        </button>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>

      <section id="place-card" class="place-card" aria-live="polite"></section>

      <section id="panel" class="panel" hidden>
        <div class="panel-inner" id="panel-inner"></div>
      </section>
    </main>

    <nav class="tabs" aria-label="Game views">
      <button data-tab="town" class="active"><span>⌂</span>Town</button>
      <button data-tab="learn"><span>あ</span>Learn<i class="tab-dot" id="dot-learn" hidden></i></button>
      <button data-tab="people"><span>♡</span>People<i class="tab-dot" id="dot-people" hidden></i></button>
      <button data-tab="journey"><span>✧</span>Journey<i class="tab-dot" id="dot-journey" hidden></i></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <input id="import-file" type="file" accept="application/json" hidden>
  <script src="journey.js?v=7"></script>
  <script src="content.js?v=7"></script>
  <script src="engine.js?v=7"></script>
  <script src="audio.js?v=7"></script>
  <script src="app.js?v=7"></script>
  <script src="panels.js?v=7"></script>
  <script src="tutorial.js?v=7"></script>
  <script type="module" src="world.js?v=7"></script>
</body>
</html>
